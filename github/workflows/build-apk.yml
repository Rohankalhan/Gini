import base64
import os

zip_path = "YouTubeAIAgentPro.zip"
with open(zip_path, "rb") as f:
    b64_str = base64.b64encode(f.read()).decode('utf-8')

print("B64 length:", len(b64_str))
# Let's save a self-extracting HTML file that automatically triggers download on mobile Chrome!
html_content = f"""<!DOCTYPE html>
<html>
<head><title>Downloading YouTubeAIAgentPro.zip</title></head>
<body>
<h2>Downloading YouTubeAIAgentPro.zip...</h2>
<p>Agar download start nahi hua, toh neeche button par click karein:</p>
<a id="dl" href="data:application/zip;base64,{b64_str}" download="YouTubeAIAgentPro.zip">
  <button style="padding:15px 25px;font-size:18px;background:#ff3b30;color:white;border:none;border-radius:8px;">
    Download YouTubeAIAgentPro.zip
  </button>
</a>
<script>
  document.getElementById('dl').click();
</script>
</body>
</html>"""

with open("download.html", "w") as f:
    f.write(html_content)

print("download.html created, size:", os.path.getsize("download.html"))
